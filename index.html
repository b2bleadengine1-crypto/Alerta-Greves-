<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>GrevesPT - Monitor de Greves em Portugal | PWA</title>
  <meta name="description" content="PWA offline-first para planeamento, consulta de greves, alertas e serviços mínimos em Portugal." />
  
  <!-- Open Graph & Social Cards -->
  <meta property="og:title" content="GrevesPT - Monitor de Greves em Portugal" />
  <meta property="og:description" content="PWA offline-first para planeamento, consulta de greves, alertas e serviços mínimos em Portugal." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="/" />
  <meta property="og:image" content="/pwa-512x512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  
  <!-- PWA & Mobile Web Capabilities -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#020617" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GrevesPT" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />

  <!-- OneSignal Web Push SDK v16 Oficial (GitHub Pages & Subpastas) -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    const isGitHubPages = window.location.pathname.includes('/Alerta-Greves-') || window.location.hostname.includes('github.io');
    const swScope = isGitHubPages ? "/Alerta-Greves-/" : "/";
    const swPath = isGitHubPages ? "Alerta-Greves-/OneSignalSDKWorker.js" : "OneSignalSDKWorker.js";

    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "a61ef792-5e95-4367-99cf-e9ab137506c3",
          serviceWorkerParam: { scope: swScope },
          serviceWorkerPath: swPath,
          notifyButton: { enable: false },
          allowLocalhostAsSecureOrigin: true
        });
      } catch (err) {
        console.warn('[OneSignal Init Error]:', err);
      }
    });
  </script>

  <style>
    /* Suporte a Safe-Areas em dispositivos com notch (iPhone/iPad) */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      -webkit-tap-highlight-color: transparent;
      background-color: #020617;
      color: #f8fafc;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-blue-600 selection:text-white antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
