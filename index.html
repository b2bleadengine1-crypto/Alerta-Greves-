<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerta Greves Portugal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- OneSignal Web SDK v16 -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "a61ef792-5e95-4367-99cf-e9ab137506c3",
        serviceWorkerPath: "Alerta-Greves-/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/Alerta-Greves-/" },
        notifyButton: { enable: true }
      });
    });
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
    <div class="max-w-2xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-red-500 flex items-center gap-2">
          <span>🚨</span> GrevesPT
        </h1>
        <p class="text-xs text-slate-400">Monitor oficial de greves e pré-avisos em Portugal</p>
      </div>
      <div class="flex gap-2">
        <a href="https://t.me/alertagreves_pt" target="_blank" class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-2 rounded-lg font-medium flex items-center gap-1 transition">
          ✈️ Telegram
        </a>
        <button onclick="window.OneSignalDeferred.push(async (e) => { await e.Notifications.requestPermission(); })" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-3 py-2 rounded-lg font-medium flex items-center gap-1 transition">
          🔔 Push
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4 space-y-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
      <p class="text-sm text-slate-300">Canal Oficial de Alertas Imediatos:</p>
      <a href="https://t.me/alertagreves_pt" target="_blank" class="text-sky-400 text-sm font-semibold hover:underline">
        t.me/alertagreves_pt ↗
      </a>
    </div>

    <!-- Live Strikes Container -->
    <div id="greves-container" class="space-y-3">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 animate-pulse">
        <div class="h-4 bg-slate-800 rounded w-3/4 mb-2"></div>
        <div class="h-3 bg-slate-800 rounded w-1/2"></div>
      </div>
    </div>
  </main>

  <script>
    async function loadGreves() {
      try {
        const response = await fetch('./greves.json');
        const data = await response.json();
        const container = document.getElementById('greves-container');
        container.innerHTML = '';
        
        if (!data || data.length === 0) {
          container.innerHTML = '<div class="text-center text-slate-500 py-8">Sem greves ou pré-avisos registados de momento.</div>';
          return;
        }

        data.forEach(greve => {
          const card = document.createElement('div');
          card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2';
          card.innerHTML = `
            <div class="flex justify-between items-start">
              <span class="text-xs px-2 py-1 bg-red-950 text-red-400 border border-red-800 rounded-md font-semibold">${greve.setor || 'Geral'}</span>
              <span class="text-xs text-slate-400">${greve.estado || 'Pré-Aviso'}</span>
            </div>
            <h2 class="text-lg font-bold text-white">${greve.operador || 'Empresa / Setor'}</h2>
            <p class="text-sm text-slate-300">📅 <b>Data:</b> ${greve.data_inicio || 'A definir'} até ${greve.data_fim || ''}</p>
            <p class="text-sm text-slate-300">⚖️ <b>Serviços Mínimos:</b> ${greve.servicos_minimos || 'A aguardar decisão'}</p>
            ${greve.fonte_url ? `<a href="${greve.fonte_url}" target="_blank" class="text-xs text-sky-400 hover:underline inline-block mt-1">Ver fonte oficial ↗</a>` : ''}
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error("Erro ao carregar greves.json:", err);
      }
    }
    loadGreves();
  </script>
</body>
</html>
