name: Strike Monitor & Live Data Pipeline (GrevesPT)

on:
  schedule:
    # Runs every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows one-click manual triggering from GitHub Actions UI
  push:
    paths:
      - 'scraper_greves.py'
      - 'ai_parser.py'
      - 'notifier.py'
      - '.github/workflows/atualizar_greves.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  scrape-and-notify:
    name: Scrape Live Feeds & Dispatch Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Scrape and Generate greves.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          python scraper_greves.py

      - name: Step 2 - Dispatch Unconditional Notifications to Telegram & OneSignal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          python notifier.py

      - name: Step 3 - Commit and Push Updated Strike Data Reliably
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add greves.json public/greves.json greves_arquivo.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): update strike records and minimum services [skip ci]"
            git push
            echo "Successfully committed and pushed updated data."
          else
            echo "No changes detected in greves.json. Working tree is clean."
          fi
