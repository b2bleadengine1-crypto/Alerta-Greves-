name: Strike Monitor, Pipeline & GitHub Pages Deploy (GrevesPT)

on:
  schedule:
    # Runs every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual one-click trigger
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    name: Scrape Live Feeds & Dispatch Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Scrape and Generate greves.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          python scraper_greves.py

      - name: Step 2 - Dispatch Unconditional Notifications to Telegram & OneSignal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          python notifier.py

      - name: Step 3 - Commit and Push Updated Strike Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add greves.json public/greves.json greves_arquivo.json OneSignalSDKWorker.js index.html || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): update strike records and minimum services [skip ci]"
            git push
            echo "Successfully committed and pushed updated data to repository."
          else
            echo "No data changes detected. Working tree clean."
          fi

      - name: Step 4 - Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Step 5 - Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Serves root directory for GitHub Pages (index.html, OneSignalSDKWorker.js, greves.json)

      - name: Step 6 - Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
